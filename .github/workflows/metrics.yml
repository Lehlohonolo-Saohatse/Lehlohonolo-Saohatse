name: GitHub Metrics

on:
  schedule:
    - cron: "0 * * * *" # updates every hour (you may change it)
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Basic settings
          user: Lehlohonolo-Saohatse
          template: classic
          base: header, repositories, activity, community
      
          # Include programming languages
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 12

          # Detect frameworks & technologies
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24

          # Ecosystem (npm, pip, Maven, Gradle)
          plugin_ecosystems: yes

          # Repositories metadata & tech
          repositories: 200
